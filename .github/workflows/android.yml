name: Android checks and releases
on:
  pull_request:
  push:
    branches: [main]
    tags: ['android-v*']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release policy
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Resolve release version
        id: version
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || { echo "::error::Release tags must point to reviewed default-branch commits."; exit 1; }
          python3 scripts/release/version.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install pinned Flutter 3.47.7
        run: |
          git clone https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout --detach abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
  build:
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Flutter 3.47.7
        run: |
          git clone https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout --detach abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Build and verify signed AAB and APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NAME: ${{ needs.checks.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.checks.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m\norg.gradle.workers.max=2\n' > "$HOME/.gradle/gradle.properties"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$KEYSTORE_BASE64" || { echo '::error::Configure android-release signing secrets (docs/android-release.md).'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/aab-verification.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/aab-verification.txt"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          "$build_tools/zipalign" -c -P 16 4 build/app/outputs/flutter-apk/app-release.apk
          python3 scripts/release/verify_media_permissions.py build/app/outputs/flutter-apk/app-release.apk --aapt "$build_tools/aapt"
          python3 scripts/release/verify_native_alignment.py build/app/outputs/flutter-apk/app-release.apk
          mkdir -p release-artifacts
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/app-release.apk release-artifacts/
          cd release-artifacts
          sha256sum app-release.aab app-release.apk > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: later-android-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
