name: Deploy Later website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

# Build dependencies never receive a write-capable token.
permissions:
  contents: read

concurrency:
  group: later-website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked dependencies
        working-directory: website
        run: npm ci
      - name: Build for the repository Pages URL
        working-directory: website
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repository_name="${REPOSITORY#*/}"
          owner="${REPOSITORY%/*}"
          if [[ "${repository_name,,}" == "${owner,,}.github.io" ]]; then
            export BASE_PATH=/
          else
            export BASE_PATH="/${repository_name}/"
          fi
          npm run build
          test -f dist/.nojekyll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: later-website
          path: website/dist/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: later-website
          path: generated-site
      - name: Publish generated files to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep credentials out of repository URLs and persisted Git config.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          output="$GITHUB_WORKSPACE/generated-site"
          publication="$RUNNER_TEMP/later-pages"
          git init -b gh-pages "$publication"
          cd "$publication"
          git remote add origin "https://github.com/$REPOSITORY.git"
          existing="$(git ls-remote --heads origin refs/heads/gh-pages)"
          if [[ -n "$existing" ]]; then
            git fetch --depth=1 origin gh-pages
            git reset --hard FETCH_HEAD
          fi
          # Only generated output is copied; app/source files never enter this branch.
          rsync -a --delete --exclude=.git/ "$output/" ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet || ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit -m "Build website from $SOURCE_SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Request the branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not automatically trigger branch Pages builds.
          # Explicitly enqueue one using the Pages write permission instead.
          if ! configuration="$(gh api "repos/$REPOSITORY/pages")"; then
            echo '::error::The generated gh-pages branch is ready. In Settings > Pages choose Deploy from a branch, gh-pages, /(root), save, then rerun this workflow.'
            exit 1
          fi
          if ! jq -e '.build_type == "legacy" and .source.branch == "gh-pages" and .source.path == "/"' <<< "$configuration" >/dev/null; then
            echo '::error::Settings > Pages must use Deploy from a branch, gh-pages, /(root).'
            exit 1
          fi
          gh api --method POST "repos/$REPOSITORY/pages/builds"
